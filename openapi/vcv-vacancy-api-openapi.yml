components:
  schemas:
    VacancyCompetence:
      properties:
        id:
          type: integer
        title:
          type: string
        hint:
          type: string
          nullable: true
        competence_view_id:
          type: integer
          description: 'See [/api/v3/competence-views](#/vacancy/get_api_v3_competence_levels)

            '
        competence_level_id:
          type: integer
          description: 'See [/api/v3/competence-levels](#/vacancy/get_api_v3_competence_views)

            '
        vacancy_id:
          type: integer
        sort_order:
          type: integer
      type: object
    VacancyModuleStage:
      properties:
        id:
          type: integer
        id_module:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        minutes:
          type: integer
          nullable: true
        vacancy_id:
          type: integer
      type: object
    VacancyModule:
      properties:
        id:
          type: integer
        id_module:
          type: string
        is_active:
          type: boolean
        vacancy_id:
          type: integer
      type: object
    VacancyUrlHistory:
      properties:
        id:
          type: integer
        vacancy_id:
          type: string
        landing_url_path:
          type: string
      type: object
    Permission:
      properties:
        id:
          type: integer
        permission:
          type: string
        user_id:
          type: integer
        vacancy_id:
          type: integer
        date_created:
          type: string
          format: date-time
      type: object
    Country:
      properties:
        id:
          type: integer
        code:
          type: string
        title_en:
          type: string
        title_ru:
          type: string
      type: object
    Vacancy:
      properties:
        id:
          type: integer
        token:
          type: string
        title:
          type: string
        active:
          type: boolean
        user_id:
          type: integer
        language_id:
          type: integer
        created_at:
          type: string
          format: date-time
      type: object
    ResponseStatus:
      properties:
        id:
          type: integer
        title:
          type: string
        active:
          type: boolean
        on_top:
          type: boolean
        sort_order:
          type: integer
        company_id:
          type: integer
          nullable: true
        parent_id:
          type: integer
          nullable: true
        id_compatibility:
          type: integer
        color:
          type: string
        is_base:
          type: boolean
        is_hidden:
          type: boolean
        is_system:
          type: boolean
        is_stage:
          type: boolean
      type: object
    User:
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        email:
          type: string
        position:
          type: string
        logo_url:
          type: string
          nullable: true
        geo_id:
          type: integer
        lanaguage_id:
          type: integer
        company_id:
          type: integer
        userName:
          type: object
          nullable: true
          properties:
            user_id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            language_id:
              type: integer
            id:
              type: integer
      type: object
    ResponseStatusEmailTemplate:
      properties:
        id:
          type: integer
        vacancy_id:
          type: integer
        template_header:
          type: string
        template_text:
          type: string
        title:
          type: string
        active:
          type: boolean
        manual:
          type: boolean
        response_status_id:
          type: integer
      type: object
    CompetenceView:
      properties:
        id:
          type: integer
        title:
          type: string
      type: object
    Language:
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        bcp47_tag:
          type: string
      type: object
    CompetenceLevel:
      properties:
        id:
          type: integer
        min_value:
          type: integer
        max_value:
          type: integer
        title:
          type: string
      type: object
    RemindEmail:
      properties:
        id:
          type: integer
        vacancy_id:
          type: integer
        text:
          type: string
        header:
          type: string
        active:
          type: boolean
        type_id:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: "Type ids:\n  * `1` - Interview remind (3 day reminder)\n  * `2` - Videointerview remind (2 hour reminder)\n  * `3` - Interview completed notification (Application confirmation)\n"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
  parameters:
    filter_active:
      name: filter[active]
      in: query
      required: false
      schema:
        type: boolean
    filter_user_id:
      name: filter[user_id]
      in: query
      required: false
      schema:
        oneOf:
        - type: integer
        - type: array
          items:
            type: integer
    pagination_page:
      name: page
      in: query
      description: page number
      required: false
      schema:
        type: integer
        default: 1
    filter_vacancy_id:
      name: filter[vacancy_id]
      in: query
      required: false
      schema:
        oneOf:
        - type: integer
        - type: array
          items:
            type: integer
    pagination_page_size:
      name: limit
      in: query
      description: page size
      required: false
      schema:
        type: integer
        default: 20
    filter_id:
      name: filter[id]
      in: query
      required: false
      schema:
        oneOf:
        - type: integer
        - type: array
          items:
            type: integer
    filter_response_status_id:
      name: filter[response_status_id]
      in: query
      required: false
      schema:
        oneOf:
        - type: integer
        - type: array
          items:
            type: integer
    sort_order:
      name: sort[order]
      in: query
      description: sort order
      required: false
      schema:
        type: string
        default: desc
        enum:
        - asc
        - desc
    filter_created_at_to:
      name: filter[created_at][to]
      in: query
      required: false
      schema:
        type: string
        format: date-time
    filter_created_at_from:
      name: filter[created_at][from]
      in: query
      required: false
      schema:
        type: string
        format: date-time
    id:
      name: id
      in: path
      description: entity id
      required: true
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
