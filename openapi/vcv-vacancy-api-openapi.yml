      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                permission:
                  type: string
                  enum:
                  - admin
                  - role_edit_scoring
                  - role_read
                  description: "Permissions:\n  * `admin` - Application administration, edit application materials, view all hiring team members’ activities, evaluate applications, communicate with candidates.\n  * `role_edit_scoring` - Edit application materials, evaluate applications, communicate with candidates.\n  * `role_read` - Evaluate applications only.\n"
              type: object
      responses:
        '200':
          description: Updated vacancy permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
    delete:
      description: Delete vacancy permission
      tags:
      - vacancy
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Deleted vacancy permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
