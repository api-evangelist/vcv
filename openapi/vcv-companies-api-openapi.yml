openapi: 3.2.0
info:
  title: VCV Companies API
  description: open api
  version: v3
servers:
- url: https://my.vcv.ai
- url: https://my.vcv.ru
- url: '{hostname}'
  variables:
    hostname:
      default: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: Companies
paths:
  /api/v3/companies/search:
    get:
      description: Get companies list with search and pagination
      tags:
      - Companies
      parameters:
      - name: page
        in: query
        description: page number
        required: false
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        description: page size
        required: false
        schema:
          type: integer
          default: 20
      - name: sort[order]
        in: query
        description: sort order
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      - name: sort[by]
        in: query
        description: Sort field
        required: false
        schema:
          type: string
          default: id
          enum:
          - id
          - name
          - date_created
          - active
      - name: filter[id]
        in: query
        description: Company ID filter
        required: false
        schema:
          type: integer
      - name: filter[name]
        in: query
        description: Company name filter (partial match)
        required: false
        schema:
          type: string
      - name: filter[active]
        in: query
        description: Company active status filter
        required: false
        schema:
          type: boolean
      - name: with[]
        in: query
        description: Relations to retrieve
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - limits
            - geo
            - language
            - responseStatuses
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              schema:
                properties:
                  _total_items:
                    type: integer
                  _page:
                    type: integer
                  _page_count:
                    type: integer
                  _links:
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            format: uri
                      next:
                        type: object
                        properties:
                          href:
                            type: string
                            format: uri
                      last:
                        type: object
                        properties:
                          href:
                            type: string
                            format: uri
                    type: object
                  _embedded:
                    type: object
                    properties:
                      companies:
                        type: array
                        items:
                          allOf:
                          - type: object
                            properties:
                              id:
                                type: integer
                              date_created:
                                type: string
                                format: date-time
                              active:
                                type: boolean
                              name:
                                type: string
                              phone:
                                type:
                                - string
                                - 'null'
                              geo_id:
                                type:
                                - integer
                                - 'null'
                              language_id:
                                type:
                                - integer
                                - 'null'
                              company_source_id:
                                type:
                                - integer
                                - 'null'
                              time_format:
                                type:
                                - string
                                - 'null'
                              domain_prefix:
                                type:
                                - string
                                - 'null'
                              domain_prefix_previous:
                                type:
                                - string
                                - 'null'
                              logo_url:
                                type:
                                - string
                                - 'null'
                              invite_logo_url:
                                type:
                                - string
                                - 'null'
                              is_permanent_response_link:
                                type: boolean
                              is_test:
                                type: boolean
                              is_approval_needed:
                                type: boolean
                              is_videoresume:
                                type: boolean
                              is_onboarding_enabled:
                                type: boolean
                              is_password_expiry:
                                type: boolean
                              is_unique_password:
                                type: boolean
                              expired_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                          - type: object
                            properties:
                              limits:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  date_created:
                                    type: string
                                    format: date-time
                                  active:
                                    type: boolean
                                  user_id:
                                    type: integer
                                  vacancy_limit:
                                    type:
                                    - integer
                                    - 'null'
                                  response_limit:
                                    type:
                                    - integer
                                    - 'null'
                                  response_balance:
                                    type:
                                    - integer
                                    - 'null'
                                  company_id:
                                    type: integer
                              geo:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                                  code:
                                    type: string
                              language:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                                  code:
                                    type: string
                              responseStatuses:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                    name:
                                      type: string
                                    color:
                                      type: string
                                    company_id:
                                      type: integer
                type: object
      summary: Get api companies search
      x-summary-source: derived
      operationId: getApiV3CompaniesSearch
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
