get:
  description: Get vacancy integration module list
  tags:
    - integration
  parameters:
    - $ref: '../../components/parameters.yaml#/pagination_page'
    - $ref: '../../components/parameters.yaml#/pagination_page_size'
    - $ref: '../../components/parameters.yaml#/sort_order'
    - $ref: '../../components/parameters.yaml#/filter_id'
    - $ref: '../../components/parameters.yaml#/filter_vacancy_id'
  responses:
    '200':
      description: list of vacancy integrations
      content:
        application/json:
          schema:
            properties:
              _total_items:
                type: integer
              _page:
                type: integer
              _page_count:
                type: integer
              _links:
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  next:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  last:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                type: object
              _embedded:
                type: object
                properties:
                  emails:
                    type: array
                    items:
                      $ref: '../../components/integration.yaml#/VacancyIntegration'
            type: object
post:
  description: Create vacancy integration
  tags:
    - integration
  requestBody:
    required: true
    content:
      application/json:
        schema:
          properties:
            url:
              type: array
              items:
                type: string
              description: Url of external system, will be "src" for iframe on interview stage
            vacancy_id:
              type: integer
          type: object
  responses:
    '200':
      description: Created integration
      content:
        application/json:
          schema:
            $ref: '../../components/integration.yaml#/VacancyIntegration'