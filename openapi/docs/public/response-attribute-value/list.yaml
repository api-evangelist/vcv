get:
  description: Get response attribute values list
  tags:
    - integration
  parameters:
    - $ref: '../../components/parameters.yaml#/token'
    - $ref: '../../components/parameters.yaml#/pagination_page'
    - $ref: '../../components/parameters.yaml#/pagination_page_size'
    - $ref: '../../components/parameters.yaml#/sort_order'
    - $ref: '../../components/parameters.yaml#/filter_id'
    - name: with[]
      in: query
      description: Relations to retrieve
      required: false
      schema:
        type: array
        items:
          type: string
          enum: [
              'attribute'
          ]
    - name: sort[by]
      in: query
      description: sort field
      required: false
      schema:
        type: string
        default: 'id'
        enum: [
            'id',
            'created_at',
            'attribute.sort_order',
        ]
    - name: filter[response_attribute_id]
      in: query
      description: Attribute id filter
      required: false
      schema:
        type: integer
    - name: filter[response_attribute_code]
      in: query
      description: Attribute code filter
      required: false
      schema:
        type: string
  responses:
    '200':
      description: list of response attributes
      content:
        application/json:
          schema:
            properties:
              _total_items:
                type: integer
              _page:
                type: integer
              _page_count:
                type: integer
              _links:
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  next:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  last:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                type: object
              _embedded:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      allOf:
                        - $ref: '../../components/response.yaml#/ResponseAttributeValue'
                        - type: object
                          properties:
                            _embedded:
                              type: object
                              properties:
                                attribute:
                                  $ref: '../../components/response.yaml#/ResponseAttribute'
            type: object