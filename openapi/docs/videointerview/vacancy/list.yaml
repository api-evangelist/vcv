get:
  description: Get vacancy videointerviews list
  tags:
    - videointerview
  parameters:
    - $ref: '../../components/parameters.yaml#/pagination_page'
    - $ref: '../../components/parameters.yaml#/pagination_page_size'
    - name: with[]
      in: query
      description: Relations to retrieve
      required: false
      schema:
        type: array
        items:
          type: string
          enum: [ 'questions', 'questions.video' ]
    - $ref: '../../components/parameters.yaml#/filter_id'
    - $ref: '../../components/parameters.yaml#/filter_vacancy_id'
    - $ref: '../../components/parameters.yaml#/filter_created_at_from'
    - $ref: '../../components/parameters.yaml#/filter_created_at_to'
  responses:
    '200':
      description: list of vacancy videointerviews
      content:
        application/json:
          schema:
            properties:
              _total_items:
                type: integer
              _page:
                type: integer
              _page_count:
                type: integer
              _links:
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  next:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  last:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                type: object
              _embedded:
                type: object
                properties:
                  vacancy_videointerviews:
                    type: array
                    items:
                      allOf:
                        - $ref: '../../components/videointerview.yaml#/VacancyVideointerview'
                        - type: object
                          properties:
                            _embedded:
                              type: object
                              properties:
                                questions:
                                  type: array
                                  items:
                                    allOf:
                                      - $ref: '../../components/videointerview.yaml#/VideointerviewQuestion'
                                      - type: object
                                        properties:
                                          _embedded:
                                            type: object
                                            properties:
                                              video:
                                                $ref: '../../components/videointerview.yaml#/Video'
            type: object