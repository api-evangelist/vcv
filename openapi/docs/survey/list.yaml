get:
  description: Get response surveys list
  tags:
    - survey
  parameters:
    - $ref: '../components/parameters.yaml#/pagination_page'
    - $ref: '../components/parameters.yaml#/pagination_page_size'
    - $ref: '../components/parameters.yaml#/filter_vacancy_id'
    - name: with[]
      in: query
      description: Relations to retrieve
      required: false
      schema:
        type: array
        items:
          type: string
          enum: [ 'questions', 'questions.answers', 'questions.record' ]
    - $ref: '../components/parameters.yaml#/filter_id'
    - $ref: '../components/parameters.yaml#/filter_response_id'
    - $ref: '../components/parameters.yaml#/filter_created_at_from'
    - $ref: '../components/parameters.yaml#/filter_created_at_to'
  responses:
    '200':
      description: list of response surveys
      content:
        application/json:
          schema:
            properties:
              _total_items:
                type: integer
              _page:
                type: integer
              _page_count:
                type: integer
              _links:
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  next:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  last:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                type: object
              _embedded:
                type: object
                properties:
                  surveys:
                    type: array
                    items:
                      allOf:
                        - $ref: '../components/survey.yaml#/Survey'
                        - type: object
                          properties:
                            _embedded:
                              type: object
                              properties:
                                questions:
                                  type: array
                                  items:
                                    allOf:
                                      - $ref: '../components/survey.yaml#/SurveyQuestion'
                                      - type: object
                                        properties:
                                          _embedded:
                                            type: object
                                            properties:
                                              record:
                                                $ref: '../components/survey.yaml#/SurveyRecord'
                                              answers:
                                                type: array
                                                items:
                                                  $ref: '../components/survey.yaml#/SurveyAnswer'
            type: object