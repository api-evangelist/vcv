get:
  description: Get enumeration details
  tags:
    - enumeration
  parameters:
    - $ref: '../components/parameters.yaml#/id'
  responses:
    '200':
      description: Enumeration detail
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/enumeration.yaml#/Enumeration'
patch:
  description: Update enumeration
  tags:
    - enumeration
  parameters:
    - $ref: '../components/parameters.yaml#/id'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          properties:
            title:
              type: string
          type: object
  responses:
    '200':
      description: Enumeration updated
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/enumeration.yaml#/Enumeration'