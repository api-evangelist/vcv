get:
  description: Get response status email template detail
  tags:
    - vacancy
  parameters:
    - $ref: '../../components/parameters.yaml#/id'
    - name: with[]
      in: query
      description: Relations to retrieve
      required: false
      schema:
        type: array
        items:
          type: string
          enum: [
              'vacancy',
              'status',
          ]
  responses:
    '200':
      description: Email template
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/response.yaml#/ResponseStatusEmailTemplate'
              - type: object
                properties:
                  _embedded:
                    type: object
                    properties:
                      vacancy:
                        $ref: '../../components/vacancy.yaml#/Vacancy'
                      status:
                        $ref: '../../components/response.yaml#/ResponseStatus'
delete:
  description: Delete response status email template
  tags:
    - vacancy
  parameters:
    - $ref: '../../components/parameters.yaml#/id'
  responses:
    '200':
      description: Email template
      content:
        application/json:
          schema:
            $ref: '../../components/response.yaml#/ResponseStatusEmailTemplate'
patch:
  description: Update response status email template
  parameters:
    - $ref: '../../components/parameters.yaml#/id'
    - name: with[]
      in: query
      description: Relations to retrieve
      required: false
      schema:
        type: array
        items:
          type: string
          enum: [
              'vacancy',
              'status',
          ]
  tags:
    - vacancy
  requestBody:
    required: true
    content:
      application/json:
        schema:
          properties:
            template_header:
              type: string
            template_text:
              type: string
            title:
              type: string
            manual:
              type: boolean
            active:
              type: boolean
          type: object
  responses:
    '200':
      description: Updated template
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/response.yaml#/ResponseStatusEmailTemplate'
              - type: object
                properties:
                  _embedded:
                    type: object
                    properties:
                      vacancy:
                        $ref: '../../components/vacancy.yaml#/Vacancy'
                      status:
                        $ref: '../../components/response.yaml#/ResponseStatus'