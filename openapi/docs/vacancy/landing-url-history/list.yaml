get:
  description: Get vacancy landing url history
  tags:
    - vacancy
  parameters:
    - $ref: '../../components/parameters.yaml#/pagination_page'
    - $ref: '../../components/parameters.yaml#/pagination_page_size'
    - $ref: '../../components/parameters.yaml#/sort_order'
    - $ref: '../../components/parameters.yaml#/filter_id'
    - $ref: '../../components/parameters.yaml#/filter_vacancy_id'
    - name: with[]
      in: query
      description: Relations to retrieve
      required: false
      schema:
        type: array
        items:
          type: string
          enum: [ 'vacancy' ]
    - name: filter[landing_url_path]
      in: query
      description: Landing url path filter
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Vacancy landing url history
      content:
        application/json:
          schema:
            properties:
              _total_items:
                type: integer
              _page:
                type: integer
              _page_count:
                type: integer
              _links:
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  next:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                  last:
                    type: object
                    properties:
                      href:
                        type: string
                        format: uri
                type: object
              _embedded:
                type: object
                properties:
                  url_history:
                    type: array
                    items:
                      $ref: '../../components/vacancy.yaml#/VacancyUrlHistory'
            type: object