                name: Vcv-Signature
                description: HMAC-SHA256 signature of the request body, using your
                  webhook secret as the signing key
                schema:
                  type: string
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ResponseComment'
              responses:
                '200':
                  description: Returns this code if accept the callback
        response_created:
          '{$request.body#/url}':
            post:
              parameters:
              - in: header
                name: Vcv-Signature
                description: HMAC-SHA256 signature of the request body, using your
                  webhook secret as the signing key
                schema:
                  type: string
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      allOf:
                      - $ref: '#/components/schemas/Response'
              responses:
                '200':
                  description: Returns this code if accept the callback
        candidate_refused:
          '{$request.body#/url}':
            post:
              parameters:
              - in: header
                name: Vcv-Signature
                description: HMAC-SHA256 signature of the request body, using your
                  webhook secret as the signing key
                schema:
                  type: string
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        response_id:
                          type: integer
                        refusal:
                          type: object
                          properties:
                            id:
                              type: integer
                            interview_id:
                              type: integer
                            reason:
                              type: string
                            description:
                              type: string
              responses:
                '200':
                  description: Returns this code if accept the callback
      responses:
        '200':
          description: Created webhook
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Webhook'
                - type: object
                  properties:
                    _embedded:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/User'
