aid: vcv
name: VCV
description: >-
  VCV is a recruitment-automation platform offering video interviews, candidate
  screening, assessments, and chatbot pre-screening for high-volume, graduate,
  and professional hiring, used by enterprises like PwC, PepsiCo, and Danone.
  Its VCV Open API v3 is a bearer-token REST API covering vacancies, candidate
  responses, video interviews, tests, surveys, invites, tags, users, and
  company webhooks, documented via Swagger UI at developer.vcv.ru.
